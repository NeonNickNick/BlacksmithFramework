<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>判定流程 — Blacksmith Framework</title>
<style>
  :root {
    --bg:#0d1117; --surface:#161b22; --border:#30363d;
    --text:#c9d1d9; --muted:#8b949e; --accent:#f0883e;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; }
  header {
    background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);
    border-bottom:2px solid var(--accent); padding:24px 32px; text-align:center;
  }
  header h1 { font-size:1.6rem; color:var(--accent); letter-spacing:2px; }
  header p { color:var(--muted); margin-top:4px; font-size:.85rem; }
  html, body { height:100%; }
  .wrap { max-width:98vw; margin:0 auto; padding:12px; }
  .diagram {
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:20px;
    overflow:auto; max-height:82vh;
  }
  .diagram h2 { font-size:1.05rem; color:#e3b341; margin-bottom:14px; }
  svg { display:block; min-width:1540px; }
  .legend {
    display:flex; flex-wrap:wrap; gap:18px; margin-top:20px;
    padding-top:14px; border-top:1px solid var(--border);
  }
  .legend-item { display:flex; align-items:center; gap:7px; font-size:.78rem; color:var(--muted); }
  .legend-swatch { width:12px; height:12px; border-radius:3px; flex-shrink:0; }
  footer { text-align:center; padding:20px; color:var(--muted); font-size:.75rem; border-top:1px solid var(--border); margin-top:28px; }
</style>
</head>
<body>

<header>
  <h1>⚖ 判定流程 · Swimlane 全景图</h1>
  <p>纵向为 11 个判定阶段，横向为涉及的组件与 Resolution — 动态规则作为阶段回调插入</p>
</header>

<div class="wrap">
<div class="diagram">
  <h2>JudgeRuleManager → 11 阶段链 × 组件交互矩阵</h2>

  <svg viewBox="0 0 1560 2060" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="sh"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.12"/></filter>
      <marker id="arr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
        <polygon points="0 0, 7 2.5, 0 5" fill="#f0883e"/>
      </marker>
      <marker id="arr-g" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
        <polygon points="0 0, 7 2.5, 0 5" fill="#3fb950"/>
      </marker>
      <marker id="arr-b" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
        <polygon points="0 0, 7 2.5, 0 5" fill="#58a6ff"/>
      </marker>
      <linearGradient id="row-hd" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#161b22"/><stop offset="100%" stop-color="#0d1117"/>
      </linearGradient>
    </defs>

    <!-- ====== PREAMBLE: Top pipeline overview ====== -->
    <rect x="20" y="15" width="1520" height="88" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

    <!-- Boxes in overview -->
    <rect x="50" y="38" width="150" height="42" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="125" y="64" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Skill Declare</text>

    <line x1="200" y1="59" x2="238" y2="59" stroke="#f0883e" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="242" y="38" width="150" height="42" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
    <text x="317" y="64" text-anchor="middle" fill="#bc8cff" font-size="13" font-weight="bold">Compile → Intent</text>

    <line x1="392" y1="59" x2="430" y2="59" stroke="#f0883e" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="434" y="38" width="190" height="42" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="529" y="64" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">Execute → TurnContext</text>

    <line x1="624" y1="59" x2="662" y2="59" stroke="#f0883e" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="666" y="32" width="210" height="54" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2.5" filter="url(#sh)"/>
    <text x="771" y="55" text-anchor="middle" fill="#f0883e" font-size="13" font-weight="bold">11-Stage Chain</text>
    <text x="771" y="74" text-anchor="middle" fill="#8b949e" font-size="10">JudgeRuleManager.Judge()</text>

    <line x1="876" y1="59" x2="914" y2="59" stroke="#f0883e" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="918" y="38" width="160" height="42" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
    <text x="998" y="64" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">Body.GetView()</text>

    <!-- Dynamic rule callout -->
    <rect x="1120" y="30" width="390" height="58" rx="8" fill="rgba(57,210,192,0.04)" stroke="#39d2c0" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="1315" y="52" text-anchor="middle" fill="#39d2c0" font-size="11" font-weight="bold">动态规则 = 插入阶段的回调 (Before / Override / After)</text>
    <text x="1315" y="72" text-anchor="middle" fill="#8b949e" font-size="10">LinkJudgeRuleDynamic → _mutationsOnCompile → Compile 时落地到 StageRuleContainer</text>

    <!-- ====== COLUMN HEADERS ====== -->
    <!-- Stage# -->
    <rect x="20" y="120" width="90" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="65" y="144" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="bold">阶段 · 优先级</text>

    <!-- TurnContext / Resolution column -->
    <rect x="118" y="120" width="220" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="228" y="144" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="bold">Resolution 流转 (TurnContext)</text>

    <!-- Effect column -->
    <rect x="346" y="120" width="180" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="436" y="144" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="bold">Effect 系统</text>

    <!-- Attack / Defense column -->
    <rect x="534" y="120" width="220" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="644" y="144" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="bold">攻击 · 防御 · 资源</text>

    <!-- JudgeRuleManager column -->
    <rect x="762" y="120" width="200" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="862" y="144" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="bold">JudgeRuleManager 内部</text>

    <!-- Dynamic Rules column -->
    <rect x="970" y="120" width="260" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="1100" y="144" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="bold">动态规则 Mutation 插入点</text>

    <!-- Body / Community column -->
    <rect x="1238" y="120" width="180" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="1328" y="144" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="bold">Body · Community</text>

    <!-- Clock column -->

    <text x="1483" y="144" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="bold">Clock 推进</text>

    <!-- ====== ROW 0: Before Pipeline ====== -->
    <rect x="20" y="166" width="1520" height="1" stroke="#30363d" stroke-width="0.5"/>

    <!-- Row label -->
    <rect x="20" y="175" width="90" height="36" rx="5" fill="rgba(88,166,255,0.08)" stroke="#58a6ff" stroke-width="1"/>
    <text x="65" y="198" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="bold">管线之前</text>

    <!-- TurnContext: Write resolutions -->
    <rect x="118" y="175" width="220" height="80" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="228" y="198" text-anchor="middle" fill="#3fb950" font-size="11">Intent.Execute(Community)</text>
    <text x="130" y="218" fill="#8b949e" font-size="9">WriteAttack → AttackResolution ✓ 可移动</text>
    <text x="130" y="234" fill="#8b949e" font-size="9">WriteDefense → DefenseResolution ✓ 可移动</text>
    <text x="130" y="250" fill="#8b949e" font-size="9">WriteEffect → EffectResolution ✓ 可移动</text>

    <!-- Effect column: empty before pipeline -->
    <rect x="346" y="175" width="180" height="80" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
    <text x="436" y="220" text-anchor="middle" fill="#484f58" font-size="10">—</text>

    <!-- Attack/Def column: UseResource direct -->
    <rect x="534" y="175" width="220" height="80" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="644" y="198" text-anchor="middle" fill="#f85149" font-size="11">WriteFree(..., false) 直接执行</text>
    <text x="546" y="218" fill="#8b949e" font-size="9">UseResource → Resource.Use()</text>
    <text x="546" y="234" fill="#8b949e" font-size="9">LoseHP / LoseMHP → Health 直接修改</text>
    <text x="546" y="250" fill="#8b949e" font-size="9">WriteRecovery → Health.GainHP()</text>

    <!-- JudgeRuleManager column -->
    <rect x="762" y="175" width="200" height="80" rx="6" fill="#0d1117" stroke="#bc8cff" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="862" y="198" text-anchor="middle" fill="#bc8cff" font-size="11">Compile 阶段动态注册</text>
    <text x="774" y="218" fill="#8b949e" font-size="9">LinkJudgeRuleDynamic 记录</text>
    <text x="774" y="234" fill="#8b949e" font-size="9">Compile 时 AddJudgeRule</text>
    <text x="774" y="250" fill="#8b949e" font-size="9">→ 按 source 专门化 → RuleUnit</text>

    <!-- Dynamic Rules: how they register -->
    <rect x="970" y="175" width="260" height="80" rx="6" fill="rgba(57,210,192,0.04)" stroke="#39d2c0" stroke-width="1"/>
    <text x="1100" y="198" text-anchor="middle" fill="#39d2c0" font-size="11">Mutation → RuleUnit 插入</text>
    <text x="982" y="218" fill="#8b949e" font-size="9">Override → _overrideRules (替换 Base)</text>
    <text x="982" y="234" fill="#8b949e" font-size="9">Modifier+Before → _modifiersBefore</text>
    <text x="982" y="250" fill="#8b949e" font-size="9">Modifier+After → _modifiersAfter</text>

    <!-- Empty columns -->
    <rect x="1238" y="175" width="180" height="80" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
    <text x="1328" y="220" text-anchor="middle" fill="#484f58" font-size="10">—</text>

    <rect x="1426" y="175" width="114" height="80" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
    <text x="1483" y="220" text-anchor="middle" fill="#484f58" font-size="10">—</text>

    <!-- Arrow down to stage chain -->
    <line x1="771" y1="255" x2="771" y2="290" stroke="#f0883e" stroke-width="2.5" marker-end="url(#arr)"/>

    <!-- ====== STAGE CHAIN BEGINS ====== -->
    <rect x="20" y="278" width="1520" height="2" stroke="#f0883e" stroke-width="2"/>

    <!-- ====== Stage 0: OnBegin ====== -->
    <rect x="20" y="290" width="90" height="105" rx="6" fill="rgba(88,166,255,0.06)" stroke="#58a6ff" stroke-width="1.2"/>
    <text x="65" y="318" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">OnBegin</text>
    <text x="65" y="338" text-anchor="middle" fill="#e3b341" font-size="10">优先级 0</text>
    <text x="65" y="358" text-anchor="middle" fill="#8b949e" font-size="9">默认: 空</text>
    <text x="65" y="380" text-anchor="middle" fill="#39d2c0" font-size="8">→ 留给动态注册</text>

    <!-- Resolutions: nothing -->
    <rect x="118" y="290" width="220" height="105" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
    <text x="228" y="348" text-anchor="middle" fill="#484f58" font-size="10">—</text>

    <!-- Effect: nothing -->
    <rect x="346" y="290" width="180" height="105" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
    <text x="436" y="348" text-anchor="middle" fill="#484f58" font-size="10">—</text>

    <!-- Attack/Def: nothing -->
    <rect x="534" y="290" width="220" height="105" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
    <text x="644" y="348" text-anchor="middle" fill="#484f58" font-size="10">—</text>

    <!-- JudgeRuleManager: Before→核心→After→Update -->
    <rect x="762" y="290" width="200" height="105" rx="6" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
    <text x="862" y="314" text-anchor="middle" fill="#58a6ff" font-size="10">StageRuleContainer.Execute()</text>
    <rect x="775" y="326" width="58" height="20" rx="4" fill="rgba(88,166,255,0.1)" stroke="#58a6ff" stroke-width="0.6"/>
    <text x="804" y="340" text-anchor="middle" fill="#58a6ff" font-size="8">Before(×0)</text>
    <rect x="840" y="326" width="58" height="20" rx="4" fill="rgba(240,136,62,0.1)" stroke="#f0883e" stroke-width="0.6"/>
    <text x="869" y="340" text-anchor="middle" fill="#f0883e" font-size="8">核心(空)</text>
    <rect x="905" y="326" width="48" height="20" rx="4" fill="rgba(63,185,80,0.1)" stroke="#3fb950" stroke-width="0.6"/>
    <text x="929" y="340" text-anchor="middle" fill="#3fb950" font-size="8">After(×0)</text>
    <text x="862" y="370" text-anchor="middle" fill="#8b949e" font-size="9">Update() → 清理 IsDead → RoundPass()</text>

    <!-- Dynamic Rules: Chanrge detection, state reset -->
    <rect x="970" y="290" width="260" height="105" rx="6" fill="rgba(57,210,192,0.06)" stroke="#39d2c0" stroke-width="1.5"/>
    <text x="1100" y="314" text-anchor="middle" fill="#39d2c0" font-size="10" font-weight="bold">⚡ 可在此插入回调</text>
    <rect x="985" y="324" width="230" height="58" rx="5" fill="#0d1117" stroke="#39d2c0" stroke-width="0.6" stroke-dasharray="3,2"/>
    <text x="1100" y="343" text-anchor="middle" fill="#8b949e" font-size="9">Lancer Charge 蓄力检测</text>
    <text x="1100" y="358" text-anchor="middle" fill="#8b949e" font-size="9">(delayRounds:1 → 下回合 OnBegin 触发)</text>
    <text x="1100" y="373" text-anchor="middle" fill="#8b949e" font-size="9">跨回合状态复位 · Buff 重置</text>

    <!-- Body: nothing -->
    <rect x="1238" y="290" width="180" height="105" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
    <text x="1328" y="348" text-anchor="middle" fill="#484f58" font-size="10">—</text>

    <!-- Clock -->
    <rect x="1426" y="290" width="114" height="105" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
    <text x="1483" y="348" text-anchor="middle" fill="#8b949e" font-size="9">阶段结束后</text>
    <text x="1483" y="365" text-anchor="middle" fill="#8b949e" font-size="9">Update()</text>

    <!-- Arrow between stages -->
    <line x1="65" y1="395" x2="65" y2="418" stroke="#f0883e" stroke-width="1.8" marker-end="url(#arr)"/>

    <!-- ====== Stage 8: OnEffectSwaping ====== -->
    <rect x="20" y="422" width="90" height="130" rx="6" fill="rgba(63,185,80,0.06)" stroke="#3fb950" stroke-width="1.2"/>
    <text x="65" y="452" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">Swap</text>
    <text x="65" y="470" text-anchor="middle" fill="#3fb950" font-size="10">Effects</text>
    <text x="65" y="496" text-anchor="middle" fill="#e3b341" font-size="10">优先级 8</text>
    <text x="65" y="518" text-anchor="middle" fill="#8b949e" font-size="9">默认: SwapEffects</text>

    <!-- TurnContext: Effect swap -->
    <rect x="118" y="422" width="220" height="130" rx="6" fill="rgba(63,185,80,0.03)" stroke="#3fb950" stroke-width="1.2"/>
    <text x="228" y="448" text-anchor="middle" fill="#3fb950" font-size="11">双方 EffectResolution 交换</text>
    <line x1="130" y1="458" x2="326" y2="458" stroke="#30363d" stroke-width="0.3"/>
    <text x="228" y="478" text-anchor="middle" fill="#c9d1d9" font-size="10">筛选: TargetType == Enemy</text>
    <text x="228" y="496" text-anchor="middle" fill="#c9d1d9" font-size="10">且 Clock.IsRinging</text>
    <text x="228" y="520" text-anchor="middle" fill="#8b949e" font-size="9">效果从施法方"到达"目标方</text>

    <!-- Effect: nothing yet -->
    <rect x="346" y="422" width="180" height="130" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
    <text x="436" y="492" text-anchor="middle" fill="#484f58" font-size="10">— (EffectEntity 尚未创建)</text>

    <text x="644" y="492" text-anchor="middle" fill="#484f58" font-size="10">—</text>

    <!-- JudgeRuleManager -->
    <rect x="762" y="422" width="200" height="130" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
    <text x="862" y="448" text-anchor="middle" fill="#3fb950" font-size="10">StageRuleContainer.Execute()</text>
    <rect x="775" y="460" width="58" height="20" rx="4" fill="rgba(88,166,255,0.1)" stroke="#58a6ff" stroke-width="0.6"/>
    <text x="804" y="474" text-anchor="middle" fill="#58a6ff" font-size="8">Before</text>
    <rect x="840" y="460" width="58" height="20" rx="4" fill="rgba(240,136,62,0.1)" stroke="#f0883e" stroke-width="0.6"/>
    <text x="869" y="474" text-anchor="middle" fill="#f0883e" font-size="8">核心 → Base</text>
    <rect x="905" y="460" width="48" height="20" rx="4" fill="rgba(63,185,80,0.1)" stroke="#3fb950" stroke-width="0.6"/>
    <text x="929" y="474" text-anchor="middle" fill="#3fb950" font-size="8">After</text>
    <text x="862" y="510" text-anchor="middle" fill="#8b949e" font-size="9">核心 = SwapEffects</text>
    <text x="862" y="530" text-anchor="middle" fill="#8b949e" font-size="9">Update() → RoundPass()</text>

    <!-- Dynamic Rules: Reflect -->
    <rect x="970" y="422" width="260" height="130" rx="6" fill="rgba(57,210,192,0.06)" stroke="#39d2c0" stroke-width="1.5"/>
    <text x="1100" y="448" text-anchor="middle" fill="#39d2c0" font-size="10" font-weight="bold">⚡ 可在此插入回调</text>
    <rect x="985" y="460" width="230" height="40" rx="5" fill="#0d1117" stroke="#39d2c0" stroke-width="0.6" stroke-dasharray="3,2"/>

    <!-- Body -->
    <rect x="1238" y="422" width="180" height="130" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
    <text x="1328" y="492" text-anchor="middle" fill="#484f58" font-size="10">—</text>

    <!-- Clock -->
    <rect x="1426" y="422" width="114" height="130" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
    <text x="1483" y="492" text-anchor="middle" fill="#8b949e" font-size="9">阶段结束后</text>
    <text x="1483" y="509" text-anchor="middle" fill="#8b949e" font-size="9">Update()</text>

    <!-- Arrow -->
    <line x1="65" y1="552" x2="65" y2="575" stroke="#f0883e" stroke-width="1.8" marker-end="url(#arr)"/>

    <!-- ====== Stage 16: OnApplyingEffect ====== -->
    <rect x="20" y="579" width="90" height="130" rx="6" fill="rgba(188,140,255,0.06)" stroke="#bc8cff" stroke-width="1.2"/>
    <text x="65" y="607" text-anchor="middle" fill="#bc8cff" font-size="11" font-weight="bold">Apply</text>
    <text x="65" y="625" text-anchor="middle" fill="#bc8cff" font-size="10">Effect</text>
    <text x="65" y="651" text-anchor="middle" fill="#e3b341" font-size="10">优先级 16</text>
    <text x="65" y="673" text-anchor="middle" fill="#8b949e" font-size="9">默认: ApplyEffect</text>

    <!-- TurnContext: Execute EffectResolution -->
    <rect x="118" y="579" width="220" height="130" rx="6" fill="rgba(188,140,255,0.03)" stroke="#bc8cff" stroke-width="1.2"/>
    <text x="228" y="605" text-anchor="middle" fill="#bc8cff" font-size="11">执行 EffectResolution</text>
