<title>项目架构 — Blacksmith Framework</title>
<style>
  :root {
    --bg:#0d1117; --surface:#161b22; --border:#30363d;
    --text:#c9d1d9; --muted:#8b949e; --accent:#f0883e;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; }
  header {
    background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);
    border-bottom:2px solid var(--accent); padding:24px 32px; text-align:center;
  }
  header h1 { font-size:1.6rem; color:var(--accent); letter-spacing:2px; }
  header p { color:var(--muted); margin-top:4px; font-size:.85rem; }
  html, body { height:100%; }
  .wrap { max-width:98vw; margin:0 auto; padding:12px; }
  .diagram {
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:20px;
    overflow:auto; max-height:82vh;
  }
  .diagram h2 { font-size:1.05rem; color:#e3b341; margin-bottom:14px; }
  svg { display:block; min-width:1340px; }
  .legend {
    display:flex; flex-wrap:wrap; gap:18px; margin-top:16px;
    padding-top:12px; border-top:1px solid var(--border);
  }
  .legend-item { display:flex; align-items:center; gap:7px; font-size:.78rem; color:var(--muted); }
  .legend-swatch { width:12px; height:12px; border-radius:3px; flex-shrink:0; }
  footer { text-align:center; padding:20px; color:var(--muted); font-size:.75rem; border-top:1px solid var(--border); margin-top:28px; }
</style>
</head>
